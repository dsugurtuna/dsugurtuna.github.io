name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML
        run: npx --yes html-validate@11.16.1 index.html projects.html 404.html writing/*.html

      - name: Check internal links
        run: python scripts/check_links.py
